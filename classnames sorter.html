<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Item Sorter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 320px;
    }
    select, button, textarea {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    #output {
      width: 320px;
      margin-top: 20px;
      display: none;
    }
    #sortedText {
      width: 100%;
      height: 150px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
    }
    #copyBtn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #copyBtn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <h2>🧩 Sort Your Items</h2>
  
  <form id="sortForm">
    <label for="items">Enter items (one per line):</label>
    <textarea id="items" rows="5" placeholder="Apple&#10;Orange&#10;Banana"></textarea>

    <label for="sortType">Sort by:</label>
    <select id="sortType">
      <option value="az">Alphabetical (A–Z)</option>
      <option value="za">Alphabetical (Z–A)</option>
      <option value="short">Length (Shortest → Longest)</option>
      <option value="long">Length (Longest → Shortest)</option>
    </select>

    <button type="submit">Sort Items</button>
  </form>

  <div id="output">
    <h3>✅ Sorted List</h3>
    <textarea id="sortedText" readonly></textarea>
    <button id="copyBtn">Copy to Clipboard</button>
  </div>

  <script>
    const form = document.getElementById('sortForm');
    const outputDiv = document.getElementById('output');
    const sortedText = document.getElementById('sortedText');
    const copyBtn = document.getElementById('copyBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const textarea = document.getElementById('items');
      const sortType = document.getElementById('sortType').value;
      let items = textarea.value.split('\n').map(i => i.trim()).filter(i => i);

      switch(sortType) {
        case 'az': items.sort((a, b) => a.localeCompare(b)); break;
        case 'za': items.sort((a, b) => b.localeCompare(a)); break;
        case 'short': items.sort((a, b) => a.length - b.length); break;
        case 'long': items.sort((a, b) => b.length - a.length); break;
      }

      sortedText.value = items.join('\n');
      outputDiv.style.display = 'block';
    });

    copyBtn.addEventListener('click', function() {
      sortedText.select();
      document.execCommand('copy');
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy to Clipboard', 2000);
    });
  </script>

</body>
</html>
