<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group List by Last Underscore</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 360px;
    }
    textarea, button {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .group {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 360px;
      margin-top: 15px;
    }
    .group h3 {
      margin: 0 0 8px;
      color: #2563eb;
      text-transform: capitalize;
    }
    .group pre {
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <h2>🔠 Separate List by Last Underscore Group</h2>

  <form id="splitForm">
    <label for="items">Enter items (one per line):</label>
    <textarea id="items" rows="6" placeholder="apple_red&#10;banana_yellow&#10;car_red&#10;orange_yellow&#10;grape_purple"></textarea>
    <button type="submit">Separate List</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('splitForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const input = document.getElementById('items').value.trim();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';

      if (!input) return;

      const lines = input.split('\n').map(line => line.trim()).filter(line => line);
      const groups = {};

      for (const line of lines) {
        const parts = line.split('_');
        const last = parts.pop();
        if (!groups[last]) groups[last] = [];
        groups[last].push(line);
      }

      for (const [key, items] of Object.entries(groups)) {
        const div = document.createElement('div');
        div.className = 'group';
        div.innerHTML = `<h3>${key}</h3><pre>${items.join('\n')}</pre>`;
        resultDiv.appendChild(div);
      }
    });
  </script>

</body>
</html>
